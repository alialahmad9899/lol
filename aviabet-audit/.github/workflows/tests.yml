name: AviaBET audit tests

on:
  push:
    paths:
      - "aviabet-audit/**"
  pull_request:
    paths:
      - "aviabet-audit/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aviabet-audit
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install --no-deps -e .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Analyze included Demo sample
        run: aviabet-audit data/sample_rounds.csv
