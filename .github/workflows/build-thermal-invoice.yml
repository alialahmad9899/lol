name: Build thermal invoice template
on:
  push:
    branches:
      - fix/thermal-invoice-template-v2
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare build directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force build | Out-Null

      - name: Build InvoiceTemplate.dll
        shell: pwsh
        run: |
          $csc35 = "$env:WINDIR\Microsoft.NET\Framework\v3.5\csc.exe"
          & $csc35 /nologo /target:library /out:build\InvoiceTemplate.dll /reference:"$env:WINDIR\Microsoft.NET\Framework\v2.0.50727\System.dll" /reference:"$env:WINDIR\Microsoft.NET\Framework\v2.0.50727\System.Data.dll" /reference:"$env:WINDIR\Microsoft.NET\Framework\v2.0.50727\System.Web.dll" /reference:"$env:WINDIR\Microsoft.NET\Framework\v2.0.50727\System.Windows.Forms.dll" InvoiceTemplate\InvoiceRenderer.cs
          if ($LASTEXITCODE -ne 0) { throw 'template build failed' }

      - name: Download dnlib
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://www.nuget.org/api/v2/package/dnlib/4.5.0' -OutFile dnlib.nupkg
          Expand-Archive dnlib.nupkg -DestinationPath dnlib_pkg -Force
          $dll = Get-ChildItem dnlib_pkg -Recurse -Filter dnlib.dll | Select-Object -First 1
          if ($null -eq $dll) { throw 'dnlib.dll not found' }
          Copy-Item $dll.FullName build\dnlib.dll -Force

      - name: Compile patcher and verifier
        shell: pwsh
        run: |
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:exe /out:build\PatchThermalInvoice.exe /reference:build\dnlib.dll /reference:build\InvoiceTemplate.dll tools\PatchThermalInvoice.cs
          if ($LASTEXITCODE -ne 0) { throw 'patcher compile failed' }
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:exe /out:build\VerifyThermalInvoice.exe /reference:build\dnlib.dll tools\VerifyThermalInvoice.cs
          if ($LASTEXITCODE -ne 0) { throw 'verifier compile failed' }

      - name: Patch Store.exe
        shell: pwsh
        run: |
          Push-Location build
          & .\PatchThermalInvoice.exe
          if ($LASTEXITCODE -ne 0) { throw 'patch execution failed' }
          Pop-Location
          Get-Content build\patch-diagnostic.txt

      - name: Verify patched executable
        shell: pwsh
        run: |
          & build\VerifyThermalInvoice.exe | Tee-Object build\verification.txt
          if ($LASTEXITCODE -ne 0) { throw 'verification failed' }

      - name: Package final build
        shell: pwsh
        run: |
          Copy-Item build\InvoiceTemplate.dll build\InvoiceTemplate.Runtime.dll -Force
          Compress-Archive -Path build\Store_THERMAL.exe,build\InvoiceTemplate.Runtime.dll,build\patch-diagnostic.txt,build\verification.txt -DestinationPath build\Store-THERMAL-INVOICE.zip -Force

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: Store-THERMAL-INVOICE
          path: build\Store-THERMAL-INVOICE.zip
