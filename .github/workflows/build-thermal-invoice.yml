name: Build thermal invoice template
on:
  push:
    branches:
      - fix/thermal-invoice-template-v2
    paths-ignore:
      - 'build/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build template DLL
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          $csc35 = "$env:WINDIR\Microsoft.NET\Framework\v3.5\csc.exe"
          & $csc35 /nologo /target:library /out:build\InvoiceTemplate.dll /reference:"$env:WINDIR\Microsoft.NET\Framework\v2.0.50727\System.dll" /reference:"$env:WINDIR\Microsoft.NET\Framework\v2.0.50727\System.Data.dll" /reference:"$env:WINDIR\Microsoft.NET\Framework\v2.0.50727\System.Web.dll" InvoiceTemplate\InvoiceRenderer.cs
          if ($LASTEXITCODE -ne 0) { throw 'template build failed' }
      - name: Download dnlib
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://www.nuget.org/api/v2/package/dnlib/4.5.0' -OutFile dnlib.nupkg
          Expand-Archive dnlib.nupkg -DestinationPath dnlib_pkg -Force
          $dll = Get-ChildItem dnlib_pkg -Recurse -Filter dnlib.dll | Select-Object -First 1
          Copy-Item $dll.FullName build\dnlib.dll -Force
      - name: Inspect actual Frm_Bill methods
        shell: pwsh
        run: |
          $src = @'
using System;
using System.IO;
using System.Text;
using dnlib.DotNet;
class Inspect {
  static void Main() {
    string root = Directory.GetParent(Environment.CurrentDirectory).FullName;
    var module = ModuleDefMD.Load(Path.Combine(root,"Store.exe"));
    TypeDef form = null;
    foreach (TypeDef t in module.Types) if (t.FullName == "Store.Frm_Bill") { form=t; break; }
    if (form == null) throw new Exception("Frm_Bill missing");
    var log = new StringBuilder();
    foreach (MethodDef m in form.Methods) {
      string n=m.Name.ToString();
      if (n.IndexOf("print",StringComparison.OrdinalIgnoreCase)>=0 || n.IndexOf("report",StringComparison.OrdinalIgnoreCase)>=0 || n.IndexOf("invoice",StringComparison.OrdinalIgnoreCase)>=0 || n.IndexOf("طباعة",StringComparison.OrdinalIgnoreCase)>=0 || n.IndexOf("فاتورة",StringComparison.OrdinalIgnoreCase)>=0) log.AppendLine(n+" | params="+m.Parameters.Count);
    }
    File.WriteAllText(Path.Combine(root,"build\\method-diagnostic.txt"),log.ToString());
    Console.WriteLine(log.ToString());
  }
}
'@
          $src | Set-Content build\Inspect.cs -Encoding UTF8
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:exe /out:build\Inspect.exe /reference:build\dnlib.dll build\Inspect.cs
          if ($LASTEXITCODE -ne 0) { throw 'inspect build failed' }
          Push-Location build
          & .\Inspect.exe
          Pop-Location
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: invoice-method-diagnostic
          path: build/method-diagnostic.txt
          if-no-files-found: error