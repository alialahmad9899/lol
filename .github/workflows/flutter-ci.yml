name: Flutter CI

on:
  push:
    branches:
      - feature/rooh-flutter-foundation
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js for Firestore rules tests
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Firestore rules test dependencies
        run: npm install --no-audit --no-fund

      - name: Test Firestore Security Rules
        run: npm run test:rules

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Normalize formatting in the temporary CI checkout before validation.
      # This does not write formatted files back to the repository.
      - name: Format Dart sources
        run: dart format lib test

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test --coverage

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rooh-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      # Release mode is signed with the debug key in Gradle and is only for internal testing.
      - name: Build Android release-mode test APK
        run: flutter build apk --release

      - name: Upload release-mode test APK
        uses: actions/upload-artifact@v4
        with:
          name: rooh-android-release-test
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
